# Keeps app-library (the app library's signing changes on top of upstream) current
# with Aidoku/Aidoku main. The home M1 publishes whenever this branch moves.
# A merge conflict fails the run, and GitHub emails about it.
name: Sync upstream

on:
  schedule:
    - cron: "17 10 * * *" # daily, 02:17 Pacific
  workflow_dispatch:

permissions:
  contents: write

concurrency: sync-upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: app-library
          fetch-depth: 0
      - name: Merge Aidoku/Aidoku main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch https://github.com/Aidoku/Aidoku.git main
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "Already up to date with upstream $(git rev-parse --short FETCH_HEAD)"
            exit 0
          fi
          git merge --no-edit -m "Merge Aidoku/Aidoku main $(git rev-parse --short FETCH_HEAD)" FETCH_HEAD
          git push origin HEAD:app-library
